; PHP OPcache tuning (fixed for OneDrive/Docker bind-mount on Windows)
; validate_timestamps=0 => PHP kisi bhi request pe source files ko stat/read NAHI karega,
; sab opcodes memory se serve honge. (Code change ke baad container restart zaroori hai.)
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1

; JIT Windows/Docker bind-mounts par intermittent hangs deta hai - disabled
opcache.jit=disable
opcache.jit_buffer_size=0
