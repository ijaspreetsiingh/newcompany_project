[www]
listen = 9000

pm = dynamic
; Launch-day concurrency: 50 workers chat + booking + maps ke liye kam padte
; the (queue ban ke 502/504). 100 workers ~ 2x headroom deta hai; RAM ke hisaab
; se 80-120 ke beech tune karein.
pm.max_children = 100
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 40
pm.max_requests = 800
pm.process_idle_timeout = 10s
; Stuck request worker ko hamesha ke liye na roke.
request_terminate_timeout = 90s
