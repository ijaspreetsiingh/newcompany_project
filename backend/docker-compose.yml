services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdds-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./php-opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
      - .env:/var/www/.env
      # Code image me bake hota hai (bind-mount hataya = native-speed file reads).
      # Vendor/views/storage-app named volumes se aate hain.
      - vendor_data:/var/www/vendor
      - view_data:/var/www/storage/framework/views
      - storage_app_data:/var/www/storage/app
    networks:
      - jdds-network
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=zCpalUqrsPNhXmo72QE9ie4gJADRGdwu
      - QUEUE_CONNECTION=redis

  db:
    image: mysql:8.0
    container_name: jdds-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: demandium_db
      MYSQL_ROOT_PASSWORD: "S72eDYA3a9sToG5gFRrnhmiEdPJx"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      # NOTE: mysql-optimization.cnf bind-mount hamesha world-writable aata hai (Windows)
      # isliye MySQL ignore karta hai. File container me copy karo:
      #   docker cp mysql-optimization.cnf jdds-db:/etc/mysql/mysql.conf.d/optimization8.cnf
      #   docker exec jdds-db chmod 644 /etc/mysql/mysql.conf.d/optimization8.cnf
      #   docker restart jdds-db
    networks:
      - jdds-network
    command: --max_connections=1000 --performance_schema=OFF

  redis:
    image: redis:7-alpine
    container_name: jdds-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jdds-network
    # volatile-lru: sirf TTL wali keys (cache/session) evict hoti hain, isliye
    # memory full hone par checkout/login crash nahi karte. Redis queue jobs ke
    # paas TTL nahi hota, wo safe rehte hain. noeviction par memory full = har
    # cache/session write error -> logins aur payments band.
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy volatile-lru --requirepass zCpalUqrsPNhXmo72QE9ie4gJADRGdwu

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jdds-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: demandium
      RABBITMQ_DEFAULT_PASS: demandium123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - jdds-network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: jdds-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # App container isi named volume me uploads likhta hai; nginx ko bhi
      # wahi volume chahiye warna nayi images (storage/) kabhi serve nahi hongi.
      - storage_app_data:/var/www/storage/app
    networks:
      - jdds-network
    depends_on:
      - app
    entrypoint: /bin/sh -c "ln -sfn /var/www/public/assets /var/www/public/public/assets 2>/dev/null; rm -f /var/www/public/storage 2>/dev/null; ln -sfn /var/www/storage/app/public /var/www/public/storage 2>/dev/null; chmod -R 755 /var/www/public/public 2>/dev/null; chown -R www-data:www-data /var/www/public/public 2>/dev/null; nginx -g 'daemon off;'"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: jdds-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "S72eDYA3a9sToG5gFRrnhmiEdPJx"
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - jdds-network
    depends_on:
      - db

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name hataya — --scale queue-worker=5 chalane ke liye
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .env:/var/www/.env
      - vendor_data:/var/www/vendor
      - view_data:/var/www/storage/framework/views
      - storage_app_data:/var/www/storage/app
    networks:
      - jdds-network
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=zCpalUqrsPNhXmo72QE9ie4gJADRGdwu
      - QUEUE_CONNECTION=redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600"]
    # Notifications/emails/assignment jobs ek worker par lag jaate the.
    # `docker compose up -d --scale queue-worker=3` bhi chal sakta hai.
    deploy:
      replicas: 3

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdds-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - view_data:/var/www/storage/framework/views
    networks:
      - jdds-network
    depends_on:
      - db
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=zCpalUqrsPNhXmo72QE9ie4gJADRGdwu
      - QUEUE_CONNECTION=redis
    # AUTO-ASSIGN: schedule:work har minute scheduler tick karta hai (jobs everyThirtySeconds handle karta hai)
    command: ["php", "artisan", "schedule:work"]

volumes:
  db-data:
  redis-data:
  rabbitmq-data:
  vendor_data:
  view_data:
  storage_app_data:

networks:
  jdds-network:
    driver: bridge
