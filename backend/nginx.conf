fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=MYAPP:100m inactive=1h max_size=256m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/public;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    index index.php;
    charset utf-8;

    large_client_header_buffers 4 32k;

    keepalive_timeout 65;
    keepalive_requests 100;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        application/vnd.ms-fontobject application/x-font-ttf font/opentype
        image/svg+xml image/x-icon;

    location ^~ /storage/ {
        alias /var/www/public/storage/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location ^~ /public/assets/ {
        alias /var/www/public/assets/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ ^/api/ {
        try_files $uri $uri/ /index.php?$query_string;
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        include fastcgi_params;

        fastcgi_buffering on;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 32 256k;
        fastcgi_busy_buffers_size 512k;

        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_keep_conn on;

        set $skip_cache 0;
        if ($request_method !~ ^(GET|HEAD)$) {
            set $skip_cache 1;
        }
        if ($request_uri ~* "/api/") {
            set $skip_cache 1;
        }
        if ($request_uri ~* "/admin") {
            set $skip_cache 1;
        }
        if ($http_cookie ~* "laravel_session") {
            set $skip_cache 1;
        }

        fastcgi_cache MYAPP;
        fastcgi_cache_valid 200 5m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}