upload_max_filesize = 1000M;
post_max_size = 1000M;

; --- Laravel / high-traffic tuning ---
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
default_charset = "UTF-8"

; Realpath cache (file_exists / class autoload fast)
realpath_cache_size = 65536
realpath_cache_ttl = 600

; Opcache (details php-opcache.ini me)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Session (file fallback ke liye GC)
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 3600

; Output buffering (JSON responses fast)
output_buffering = 4096
zlib.output_compression = Off
